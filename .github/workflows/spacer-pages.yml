# Création Audio — vraies pages des spacers (référencement Google)
# Relit les spacers publics dans Supabase et régénère spacer/<slug>.html,
# le catalogue pré-rendu de spacers.html et sitemap.xml (tools/build-spacer-pages.js).
# Ne commite QUE ces fichiers, et seulement s'ils ont changé (ajout, modif, retrait
# d'un spacer dans l'admin). Le stock exact n'est pas dans les pages : une vente
# ne déclenche donc pas de commit.
name: Pages spacers

on:
  schedule:
    - cron: '17 */6 * * *'      # aux 6 h
  workflow_dispatch:            # bouton « Run workflow » dans l'onglet Actions de GitHub
  push:
    branches: [main]
    paths:
      - 'assets/spacer-catalog.js'
      - 'tools/build-spacer-pages.js'
      - '.github/workflows/spacer-pages.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: spacer-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer les pages
        run: node tools/build-spacer-pages.js
      - name: Publier si quelque chose a changé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A spacer spacers.html sitemap.xml
          if git diff --cached --quiet; then echo "Rien à publier."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pages spacers : mise à jour automatique"
          git pull --rebase origin main
          git push origin HEAD:main
          # un push fait avec GITHUB_TOKEN peut ne pas relancer GitHub Pages : on le demande
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "Demande de build Pages ignorée."
