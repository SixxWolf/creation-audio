<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Bobine vide réutilisable">
  <rect width="200" height="200" fill="#f4f4f2"/>
  <g transform="translate(100 100)">
    <!-- flasque arrière -->
    <ellipse cx="14" cy="0" rx="58" ry="72" fill="#d7d9db"/>
    <!-- moyeu -->
    <rect x="-14" y="-30" width="30" height="60" rx="6" fill="#c3c6c9"/>
    <!-- flasque avant -->
    <ellipse cx="-14" cy="0" rx="60" ry="74" fill="#e7e9ea" stroke="#cdd0d3" stroke-width="2"/>
    <!-- perforations (motif) -->
    <g fill="#cfd2d5">
      <circle cx="-14" cy="-46" r="3"/><circle cx="-30" cy="-40" r="3"/><circle cx="2" cy="-40" r="3"/>
      <circle cx="-44" cy="-24" r="3"/><circle cx="-14" cy="-26" r="3"/><circle cx="16" cy="-24" r="3"/>
      <circle cx="-50" cy="0" r="3"/><circle cx="-30" cy="0" r="3"/><circle cx="2" cy="0" r="3"/><circle cx="22" cy="0" r="3"/>
      <circle cx="-44" cy="24" r="3"/><circle cx="-14" cy="26" r="3"/><circle cx="16" cy="24" r="3"/>
      <circle cx="-30" cy="40" r="3"/><circle cx="2" cy="40" r="3"/><circle cx="-14" cy="46" r="3"/>
    </g>
    <!-- trou central -->
    <ellipse cx="-14" cy="0" rx="15" ry="19" fill="#f4f4f2" stroke="#c3c6c9" stroke-width="2"/>
  </g>
</svg>
