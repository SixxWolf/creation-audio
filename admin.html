<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Création Audio</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png?v=3">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  body.admin{background:var(--wash);color:var(--ink);min-height:100vh}
  .muted{color:var(--muted)}
  /* le masquage doit toujours l'emporter, même sur display:grid/flex ci-dessous */
  [hidden]{display:none!important}
  /* --- login --- */
  .admin-login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .admin-login form{width:min(380px,92vw);background:var(--paper);border:1px solid var(--line);
    border-radius:18px;padding:30px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.08)}
  .admin-login h1{font-size:1.5rem;letter-spacing:-.02em;margin-bottom:4px}
  .admin-login .sub{color:var(--muted);font-size:.9rem;margin-bottom:8px}
  .admin-login input{padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:1rem;font-family:var(--display)}
  .admin-login input:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 2px rgba(255,106,43,.16)}
  .admin-login button{margin-top:4px;padding:14px;border:0;border-radius:100px;background:var(--ember);color:#fff;
    font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .admin-login button:hover{filter:brightness(1.06)}
  .login-err{display:none;color:#d0402f;font-size:.85rem;text-align:center}
  .login-err.show{display:block}
  /* --- barre + onglets --- */
  .admin-bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:12px clamp(14px,3vw,28px);background:var(--paper);border-bottom:1px solid var(--line)}
  .admin-brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .admin-brand .d{width:10px;height:10px;border-radius:50%;background:var(--ember)}
  .admin-tabs{display:flex;gap:6px;margin-left:6px}
  .admin-tab{position:relative;border:0;background:transparent;cursor:pointer;padding:8px 14px;border-radius:100px;
    font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .admin-tab.active{background:var(--ink);color:#fff}
  .admin-tab .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;
    border-radius:100px;background:var(--ember);color:#fff;font-size:.66rem}
  .admin-tab .badge[hidden]{display:none}
  #to-facture{margin-left:auto;text-decoration:none;border:1px solid var(--ember);background:transparent;cursor:pointer;
    padding:8px 14px;border-radius:100px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ember-dim)}
  #to-facture:hover{background:var(--ember);color:#fff}
  #logout{border:1px solid var(--line);background:transparent;cursor:pointer;
    padding:8px 14px;border-radius:100px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  #logout:hover{border-color:var(--ember);color:var(--ember)}
  main.admin-main{max-width:min(1760px,97vw);margin:0 auto;padding:clamp(18px,3vw,32px)}
  .tab-panel h2{font-size:1.3rem;letter-spacing:-.01em;margin-bottom:16px}
  /* --- inventaire : 4 colonnes de matériaux côte à côte, lignes compactes --- */
  /* colonnes larges qui s'adaptent au nombre : nom complet toujours visible */
  .inv-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:16px;align-items:start}
  .inv-group{min-width:0}
  .inv-group-title{font-size:.95rem;font-weight:700;letter-spacing:-.01em;margin-bottom:10px;
    padding-bottom:7px;border-bottom:1px solid var(--line)}
  .inv-group-title .muted{font-weight:400;font-size:.72rem;display:block;margin-top:2px}
  .inv-grid{display:flex;flex-direction:column;gap:6px}
  .inv-row{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 9px;background:var(--paper);
    border:1px solid var(--line);border-left:3px solid var(--line);border-radius:9px;transition:box-shadow .2s}
  .inv-row.in{border-left-color:#22a75e}
  .inv-row.out{border-left-color:#e0483a}
  .inv-row.flash-ok{box-shadow:0 0 0 2px rgba(34,167,94,.5)}
  .inv-row.flash-err{box-shadow:0 0 0 2px rgba(224,72,58,.5)}
  .inv-name{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto;font-weight:600;font-size:.9rem}
  .inv-sw{width:14px;height:14px;border-radius:50%;flex:none;background:var(--c);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
  .inv-cname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .inv-code{font-family:var(--mono);font-size:.6rem;color:var(--muted);flex:none}
  /* un seul stepper par ligne (dimension selon le toggle) */
  .inv-stepper{display:flex;align-items:center;gap:4px;flex:none;margin-left:auto}
  .inv-stepper button{width:26px;height:28px;border:1px solid var(--line);background:var(--wash);border-radius:7px;
    cursor:pointer;font-size:1rem;line-height:1;padding:0}
  .inv-stepper button:hover{border-color:var(--ember);color:var(--ember)}
  .inv-qty{width:44px;height:28px;text-align:center;border:1px solid var(--line);border-radius:7px;
    font-family:var(--mono);font-size:.84rem}
  /* toggle Refill / Avec Bobine */
  .inv-toggle{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:100px;
    background:var(--paper);margin-bottom:18px}
  .inv-toggle-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:100px;
    padding:9px 20px;font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
  .inv-toggle-btn.is-active{background:var(--ink);color:#fff}
  /* onglets matériau : mobile uniquement (sur ordinateur les 4 colonnes suffisent) */
  .inv-mat-tabs{display:none;margin-bottom:14px}
  /* --- MOBILE : lignes compactes sur UNE seule ligne, comme sur ordinateur --- */
  @media(max-width:700px){
    .inv-mat-tabs{display:flex}
    .inv-group.is-off{display:none}     /* un seul matériau à la fois */
    .inv-group-title{display:none}      /* l'onglet actif sert déjà de titre */
    main.admin-main{padding:14px 10px}
    .inv-board{gap:10px}
    .inv-row{padding:5px 7px 5px 8px;gap:6px}
    .inv-name{font-size:.86rem;gap:6px}
    .inv-code{font-size:.56rem}
    .inv-stepper{gap:3px}
    .inv-stepper button{width:30px;height:30px}   /* compact mais confortable au doigt */
    .inv-qty{width:40px;height:30px;font-size:.8rem}
  }
</style>
</head>
<body class="admin theme-3d">

<!-- CONNEXION -->
<div id="login" class="admin-login">
  <form id="login-form">
    <h1><span style="color:var(--ember)">●</span> Admin — Création Audio</h1>
    <p class="sub">Connecte-toi pour gérer l'inventaire.</p>
    <input id="login-email" type="email" placeholder="Courriel" autocomplete="username" required>
    <input id="login-pass" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
    <button id="login-btn" type="submit">Se connecter</button>
    <p id="login-err" class="login-err"></p>
  </form>
</div>

<!-- APPLICATION -->
<div id="app" hidden>
  <header class="admin-bar">
    <span class="admin-brand"><span class="d"></span>Création Audio</span>
    <nav class="admin-tabs">
      <button class="admin-tab active" data-tab="inv">Inventaire</button>
    </nav>
    <a id="to-facture" href="facture.html" target="_blank">Facturation&nbsp;↗</a>
    <button id="logout">Déconnexion</button>
  </header>

  <main class="admin-main">
    <section id="tab-inv" class="tab-panel">
      <h2>Inventaire</h2>
      <p class="muted" style="margin-bottom:16px">Modifie une quantité : c'est enregistré aussitôt et visible en direct sur le site. Choisis le stock à gérer&nbsp;:</p>
      <div class="inv-toggle" role="group" aria-label="Type de stock">
        <button type="button" class="inv-toggle-btn is-active" data-kind="refill">Recharge</button>
        <button type="button" class="inv-toggle-btn" data-kind="spool">Avec Bobine</button>
      </div>
      <!-- onglets matériau (affichés sur mobile seulement) -->
      <div id="inv-mat-tabs" class="mat-tabs inv-mat-tabs" role="tablist" aria-label="Matériau"></div>
      <div id="inv-list"></div>
    </section>
  </main>
</div>

<script src="assets/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/catalog.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
